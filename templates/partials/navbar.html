<header class="topbar">

  <!-- Page title — set per page using block -->
  <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>

  <!-- Search -->
  <div class="topbar-search-wrap">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" class="search-icon">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <input
      type="text"
      class="topbar-search"
      placeholder="Search products, SKU, reference..."
      id="globalSearch"
    />
  </div>

  <!-- Right side -->
  <div class="topbar-right">

    <!-- Notification bell for low stock -->
    {% if low_stock_count %}
    <a href="{% url 'products:list' %}?filter=low_stock" class="topbar-bell" title="Low stock alerts">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
        <path d="M8 2a5 5 0 0 1 5 5v3l1 1H2l1-1V7a5 5 0 0 1 5-5z"
              stroke="currentColor" stroke-width="1.2"/>
        <path d="M6.5 13a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <span class="bell-badge">{{ low_stock_count }}</span>
    </a>
    {% endif %}

    <!-- Avatar -->
    <div class="topbar-avatar" title="{{ request.user.username }}">
      {{ request.user.username|first|upper }}{{ request.user.username|slice:"1:2"|upper }}
    </div>

  </div>

</header>
