<header class="topbar">

  <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>

  <div class="topbar-search-wrap">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
         style="position:absolute;left:10px;top:50%;transform:translateY(-50%);
                color:var(--muted);pointer-events:none;">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.3"
            stroke-linecap="round"/>
    </svg>
    <input type="text" class="topbar-search"
           placeholder="Search products, SKU..."
           id="globalSearch"/>
  </div>

  <div class="topbar-right">

    {% if low_stock_count %}
    <a href="{% url 'products:list' %}?filter=low_stock"
       class="topbar-bell" title="{{ low_stock_count }} low stock alerts">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2a5 5 0 0 1 5 5v3l1 1H2l1-1V7a5 5 0 0 1 5-5z"
              stroke="currentColor" stroke-width="1.2"/>
        <path d="M6.5 13a1.5 1.5 0 0 0 3 0"
              stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <span class="bell-badge">{{ low_stock_count }}</span>
    </a>
    {% endif %}

    <div class="topbar-avatar" title="{{ request.user.username }}">
      {{ request.user.username|first|upper }}
    </div>

    <div style="font-size:12px;color:var(--muted);">
      {{ request.user.username }}
    </div>

  </div>

</header>
