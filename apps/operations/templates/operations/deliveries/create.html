{% extends "base.html" %}
{% block title %}New Delivery — CoreInventory{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div class="page-title">New Delivery</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px;">
      <a href="{% url 'operations:delivery_list' %}"
         style="color:var(--muted);text-decoration:none;">Deliveries</a> / Create
    </div>
  </div>
</div>

<div style="max-width:720px;">
  <div class="table-card" style="padding:24px;">
    <form method="POST" novalidate>
      {% csrf_token %}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Delivery Address</label>
          <textarea name="delivery_address" class="form-input" rows="2"
                    placeholder="Customer delivery address"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Warehouse</label>
          <select name="warehouse" class="form-input">
            <option value="">— Select Warehouse —</option>
            {% for wh in warehouses %}
              <option value="{{ wh.pk }}">{{ wh.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Schedule Date</label>
          <input type="date" name="schedule_date" class="form-input"/>
        </div>
        <div class="form-group">
          <label class="form-label">Operation Type</label>
          <input type="text" name="operation_type" class="form-input"
                 placeholder="e.g. Outgoing Shipment"/>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-input" rows="2"
                    placeholder="Optional notes"></textarea>
        </div>
      </div>

      <!-- Products -->
      <div style="margin-top:24px;padding-top:20px;
                  border-top:0.5px solid var(--border);">
        <div style="font-size:13px;font-weight:500;margin-bottom:12px;">
          Products
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Product</th>
              <th style="width:140px;">Quantity</th>
              <th style="width:40px;"></th>
            </tr>
          </thead>
          <tbody id="items-body">
            <tr class="item-row">
              <td>
                <select name="product_id" class="form-input">
                  <option value="">— Select Product —</option>
                  {% for p in products %}
                    <option value="{{ p.pk }}">
                      {{ p.name }} ({{ p.sku }}) — {{ p.current_stock }} in stock
                    </option>
                  {% endfor %}
                </select>
              </td>
              <td>
                <input type="number" name="quantity" class="form-input"
                       min="1" placeholder="0"/>
              </td>
              <td></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm"
                style="margin-top:10px;" id="add-row">
          + Add Product
        </button>
      </div>

      <div style="display:flex;gap:10px;margin-top:24px;
                  padding-top:20px;border-top:0.5px solid var(--border);">
        <button type="submit" class="btn btn-primary">Save as Draft</button>
        <a href="{% url 'operations:delivery_list' %}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
document.getElementById('add-row').addEventListener('click', function() {
  const body     = document.getElementById('items-body');
  const firstRow = body.querySelector('.item-row');
  const newRow   = firstRow.cloneNode(true);
  newRow.querySelectorAll('input').forEach(i => i.value = '');
  newRow.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  const td = newRow.querySelector('td:last-child');
  td.innerHTML = '<button type="button" class="btn btn-sm btn-danger" onclick="this.closest(\'tr\').remove()">✕</button>';
  body.appendChild(newRow);
});
</script>

{% endblock %}
