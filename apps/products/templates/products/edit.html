{% extends "base.html" %}
{% block title %}Edit {{ product.name }} — CoreInventory{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div class="page-title">Edit Product</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px;">
      <a href="{% url 'products:list' %}" style="color:var(--muted);text-decoration:none;">Products</a>
      / <a href="{% url 'products:detail' product.pk %}" style="color:var(--muted);text-decoration:none;">{{ product.name }}</a>
      / Edit
    </div>
  </div>
</div>

<div style="max-width:640px;">
  <div class="table-card" style="padding:24px;">
    <form method="POST" novalidate>
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">

        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Product Name *</label>
          <input type="text" name="name" class="form-input"
                 value="{{ product.name }}" required/>
        </div>

        <div class="form-group">
          <label class="form-label">SKU</label>
          <input type="text" class="form-input"
                 value="{{ product.sku }}" disabled
                 style="background:var(--page-bg);color:var(--muted);"/>
          <span class="form-hint">SKU cannot be changed</span>
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select name="category" class="form-input">
            <option value="">— Select Category —</option>
            {% for cat in categories %}
              <option value="{{ cat.pk }}"
                {% if product.category_id == cat.pk %}selected{% endif %}>
                {{ cat.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Unit of Measure</label>
          <select name="unit_of_measure" class="form-input">
            {% for val, label in product.UNIT_CHOICES %}
              <option value="{{ val }}"
                {% if product.unit_of_measure == val %}selected{% endif %}>
                {{ label }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Cost Price (₹)</label>
          <input type="number" name="cost_price" class="form-input"
                 value="{{ product.cost_price }}" step="0.01" min="0"/>
        </div>

        <div class="form-group">
          <label class="form-label">Reorder Level</label>
          <input type="number" name="reorder_level" class="form-input"
                 value="{{ product.reorder_level }}" min="0"/>
        </div>

        <div class="form-group">
          <label class="form-label">Warehouse</label>
          <select name="warehouse" class="form-input">
            <option value="">— Select Warehouse —</option>
            {% for wh in warehouses %}
              <option value="{{ wh.pk }}"
                {% if product.warehouse_id == wh.pk %}selected{% endif %}>
                {{ wh.name }}
              </option>
            {% endfor %}
          </select>
        </div>

      </div>
      <div style="display:flex;gap:10px;margin-top:24px;
                  padding-top:20px;border-top:0.5px solid var(--border);">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'products:detail' product.pk %}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
