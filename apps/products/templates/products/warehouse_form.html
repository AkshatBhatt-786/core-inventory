{% extends "base.html" %}
{% block title %}{{ title }} — CoreInventory{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div class="page-title">{{ title }}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px;">
      <a href="{% url 'products:warehouse_list' %}"
         style="color:var(--muted);text-decoration:none;">Warehouses</a> / {{ title }}
    </div>
  </div>
</div>

<div style="max-width:480px;">
  <div class="table-card" style="padding:24px;">
    <form method="POST" novalidate>
      {% csrf_token %}
      <div style="display:flex;flex-direction:column;gap:16px;">

        <div class="form-group">
          <label class="form-label">Warehouse Name *</label>
          <input type="text" name="name" class="form-input"
                 placeholder="e.g. Main Warehouse" required/>
        </div>

        <div class="form-group">
          <label class="form-label">Short Code *</label>
          <input type="text" name="short_code" class="form-input"
                 placeholder="e.g. WH" required/>
          <span class="form-hint">Used in reference numbers e.g. WH/IN/0001</span>
        </div>

        <div class="form-group">
          <label class="form-label">Address</label>
          <textarea name="address" class="form-input" rows="3"
                    placeholder="Warehouse address"></textarea>
        </div>

      </div>
      <div style="display:flex;gap:10px;margin-top:24px;
                  padding-top:20px;border-top:0.5px solid var(--border);">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'products:warehouse_list' %}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
